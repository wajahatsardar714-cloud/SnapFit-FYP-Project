name: snapfit_mobile
description: "SnapFit mobile app: the merchant dashboard, super admin console, size check and try-on, on the same backend and AI pipeline as the web app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.11.1
  provider: ^6.1.5+1
  go_router: ^18.1.2
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  fl_chart: ^1.3.0
  image_picker: ^1.2.4
  camera: ^0.12.2
  url_launcher: ^6.3.3
  intl: ^0.20.3
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  lucide_icons_flutter: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Manrope, the web app's typeface (one variable font; weights via the wght axis).
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
