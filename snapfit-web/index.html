<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapFit</title>
    <script>
      // Apply the saved theme before React loads, so a dark-mode reload never
      // flashes light. Key and values must match src/context/ThemeContext.jsx.
      try {
        if (localStorage.getItem('snapfit-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        // Storage blocked: stay on the default light theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
