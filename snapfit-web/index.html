<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapFit</title>
    <meta
      name="description"
      content="Help shoppers find the right clothing size with SnapFit AI clothing size estimation. Integrate photo-based sizing into your online store."
    />
    <!-- Manrope, weights 400-700 only; Google Fonts serves just the latin
         subset to latin pages (unicode-range) and swap keeps text visible. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    />
    <script>
      // Apply the saved theme before React loads, so a dark-mode reload never
      // flashes light. Key and values must match src/context/ThemeContext.jsx.
      try {
        if (localStorage.getItem('snapfit-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        // Storage blocked: stay on the default light theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
